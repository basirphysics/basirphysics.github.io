<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thermal Expansion — MCQs</title>
<style>
  html, body {
    margin: 0;
    padding: 16px;
    background: #ffffff;
  }
</style>
</head>
<body>
<div class="te-mcq-wrap">
  <style>
    .te-mcq-wrap {
      --te-blue: #2563eb;
      --te-green: #16a34a;
      --te-red: #dc2626;
      --te-bg: #f8fafc;
      --te-border: #e2e8f0;
      --te-text: #1e293b;
      max-width: 780px;
      margin: 0 auto;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--te-text);
    }
    .te-mcq-wrap * { box-sizing: border-box; }
    .te-header {
      text-align: center;
      margin-bottom: 18px;
    }
    .te-header h2 {
      font-size: 1.5rem;
      margin: 0 0 4px;
      color: var(--te-blue);
    }
    .te-header p {
      margin: 0;
      font-size: 0.9rem;
      color: #64748b;
    }
    .te-scoreboard {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      justify-content: center;
      gap: 10px;
      background: #fff;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--te-border);
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .te-score-pill {
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .te-score-pill.total { background: #eef2ff; color: #4338ca; }
    .te-score-pill.correct { background: #dcfce7; color: var(--te-green); }
    .te-score-pill.wrong { background: #fee2e2; color: var(--te-red); }
    .te-reset-btn {
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid var(--te-border);
      background: #fff;
      color: #475569;
      cursor: pointer;
    }
    .te-reset-btn:hover { background: #f1f5f9; }

    .te-q-card {
      background: #fff;
      border: 1px solid var(--te-border);
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 14px;
    }
    .te-q-title {
      font-weight: 600;
      margin-bottom: 10px;
      line-height: 1.5;
      font-size: 0.98rem;
    }
    .te-q-num { color: var(--te-blue); margin-right: 4px; }

    .te-options {
      display: grid;
      gap: 8px;
    }
    .te-opt {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border: 1px solid var(--te-border);
      border-radius: 8px;
      background: var(--te-bg);
      cursor: pointer;
      font-size: 0.92rem;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      user-select: none;
    }
    .te-opt:hover:not(.te-locked) {
      border-color: var(--te-blue);
    }
    .te-opt-letter {
      font-weight: 700;
      width: 20px;
      flex-shrink: 0;
    }
    .te-opt.correct {
      background: #dcfce7;
      border-color: var(--te-green);
      color: #166534;
    }
    .te-opt.wrong {
      background: #fee2e2;
      border-color: var(--te-red);
      color: #991b1b;
    }
    .te-opt.reveal-correct {
      background: #dcfce7;
      border-color: var(--te-green);
      color: #166534;
    }
    .te-icon {
      margin-left: auto;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .te-footer {
      text-align: center;
      margin-top: 10px;
      padding: 16px;
      border-radius: 10px;
      background: #eef2ff;
      display: none;
      font-weight: 600;
      color: #4338ca;
    }
    .te-footer.show { display: block; }
  </style>

  <div class="te-header">
    <h2>Thermal Expansion — MCQs</h2>
    <p>Physics, Grade 11 — Tap an option to answer</p>
  </div>

  <div class="te-scoreboard">
    <span class="te-score-pill total">Answered: <span id="teAnswered">0</span>/9</span>
    <span class="te-score-pill correct">Correct: <span id="teCorrect">0</span></span>
    <span class="te-score-pill wrong">Wrong: <span id="teWrong">0</span></span>
    <button class="te-reset-btn" id="teReset">Reset</button>
  </div>

  <div id="teQuizList"></div>

  <div class="te-footer" id="teFooter"></div>
</div>

<script>
(function() {
  var questions = [
    {
      q: "1. The volume of a block increases by 0.12% on heating through 20°C. The linear expansivity of the metal is:",
      options: ["1 × 10⁻⁵ °C⁻¹", "1.5 × 10⁻⁵ °C⁻¹", "2 × 10⁻⁵ °C⁻¹", "2.5 × 10⁻⁵ °C⁻¹"],
      correct: 2
    },
    {
      q: "2. A clock keeps the correct time at 20°C. It has a metallic pendulum with the coefficient of linear expansion 2 × 10⁻⁵ K⁻¹. The temperature falls to 10°C. What is the number of seconds lost or gained by the clock per day?",
      options: ["Loss of 8.64 sec", "Gain of 8.64 sec", "Loss of 19.2 sec", "Gain of 19.2 sec"],
      correct: 1
    },
    {
      q: "3. A thin copper wire of length L increases in length by 1% when heated from temperature T₁ to T₂. What is the percentage change in area when a thin copper plate of dimension 2L × L is heated from T₁ to T₂?",
      options: ["1%", "2%", "3%", "4%"],
      correct: 1
    },
    {
      q: "4. A disk (α = 1.9 × 10⁻⁵ K⁻¹) has a hole of diameter 1.5 cm at 20°C. What will be the effect on the diameter of the hole when it is heated to 150°C?",
      options: ["Increases by 0.002 cm", "Decreases by 0.002 cm", "Increases by 0.004 cm", "Decreases by 0.004 cm"],
      correct: 2
    },
    {
      q: "5. The coefficient of apparent expansion of mercury in a glass vessel is 153 × 10⁻⁶ K⁻¹ and in a steel vessel is 114 × 10⁻⁶ K⁻¹. If the coefficient of linear expansion for steel is 12 × 10⁻⁶ °C⁻¹, what is the value of the coefficient of linear expansion of glass?",
      options: ["6 × 10⁻⁶ °C⁻¹", "9 × 10⁻⁶ °C⁻¹", "27 × 10⁻⁶ °C⁻¹", "36 × 10⁻⁶ °C⁻¹"],
      correct: 1
    },
    {
      q: "6. A glass flask of volume 1 l is fully filled with mercury at 0°C. The flask and mercury are now heated up to 100°C. How much mercury will be spilt out if the coefficient of volume expansion of mercury is 1.82 × 10⁻⁴ °C⁻¹ and linear expansion of glass is 0.1 × 10⁻⁴ °C⁻¹ respectively?",
      options: ["1.52 cc", "2.12 cc", "15.2 cc", "21.2 cc"],
      correct: 2
    },
    {
      q: "7. The coefficient of linear expansion of a metal is 18 × 10⁻⁵ °C⁻¹. What will be the value of the coefficient of linear expansion in the Fahrenheit scale?",
      options: ["32 × 10⁻⁵ °F⁻¹", "18 × 10⁻⁵ °F⁻¹", "9 × 10⁻⁵ °F⁻¹", "1 × 10⁻⁴ °F⁻¹"],
      correct: 3
    },
    {
      q: "8. An iron rod (Y = 2 × 10¹² dyne cm⁻², α = 1.2 × 10⁻⁵ °C⁻¹) of radius 2.4 cm is heated from 0°C to 50°C. What is the value of the force which will be exerted if it is prevented from expanding?",
      options: ["4.34 × 10⁵ N", "2.17 × 10⁵ N", "3.12 × 10⁵ N", "2.17 × 10⁴ N"],
      correct: 1
    },
    {
      q: "9. The length of a cube increases by 0.50% when heated to change its temperature by 100°C. What will be the increment in its volume?",
      options: ["0.05%", "1.0%", "1.5%", "2%"],
      correct: 2
    }
  ];

  var answered = {};
  var listEl = document.getElementById('teQuizList');
  var answeredEl = document.getElementById('teAnswered');
  var correctEl = document.getElementById('teCorrect');
  var wrongEl = document.getElementById('teWrong');
  var footerEl = document.getElementById('teFooter');
  var resetBtn = document.getElementById('teReset');

  function letters(i) { return String.fromCharCode(97 + i); }

  function render() {
    listEl.innerHTML = '';
    questions.forEach(function(item, qi) {
      var card = document.createElement('div');
      card.className = 'te-q-card';

      var title = document.createElement('div');
      title.className = 'te-q-title';
      title.textContent = item.q;
      card.appendChild(title);

      var optsWrap = document.createElement('div');
      optsWrap.className = 'te-options';

      item.options.forEach(function(optText, oi) {
        var opt = document.createElement('div');
        opt.className = 'te-opt';

        var letterSpan = document.createElement('span');
        letterSpan.className = 'te-opt-letter';
        letterSpan.textContent = letters(oi) + '.';
        opt.appendChild(letterSpan);

        var textSpan = document.createElement('span');
        textSpan.textContent = optText;
        opt.appendChild(textSpan);

        var iconSpan = document.createElement('span');
        iconSpan.className = 'te-icon';
        opt.appendChild(iconSpan);

        var userChoice = answered[qi];
        if (userChoice !== undefined) {
          opt.classList.add('te-locked');
          if (oi === item.correct) {
            opt.classList.add('reveal-correct');
            iconSpan.textContent = '✓';
          }
          if (oi === userChoice && userChoice !== item.correct) {
            opt.classList.add('wrong');
            iconSpan.textContent = '✗';
          }
        } else {
          opt.addEventListener('click', function() {
            selectAnswer(qi, oi);
          });
        }

        optsWrap.appendChild(opt);
      });

      card.appendChild(optsWrap);
      listEl.appendChild(card);
    });
    updateScoreboard();
  }

  function selectAnswer(qi, oi) {
    if (answered[qi] !== undefined) return;
    answered[qi] = oi;
    render();
  }

  function updateScoreboard() {
    var total = questions.length;
    var answeredCount = Object.keys(answered).length;
    var correctCount = 0;
    Object.keys(answered).forEach(function(k) {
      if (answered[k] === questions[k].correct) correctCount++;
    });
    var wrongCount = answeredCount - correctCount;

    answeredEl.textContent = answeredCount;
    correctEl.textContent = correctCount;
    wrongEl.textContent = wrongCount;

    if (answeredCount === total) {
      footerEl.classList.add('show');
      footerEl.textContent = 'Quiz complete! You scored ' + correctCount + ' out of ' + total + '.';
    } else {
      footerEl.classList.remove('show');
    }
  }

  resetBtn.addEventListener('click', function() {
    answered = {};
    render();
  });

  render();
})();
</script>
</body>
</html>
